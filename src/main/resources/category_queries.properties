# ===== CATEGORY TABLE QUERY =====
category.save=INSERT INTO category (category_name) VALUES (?)
category.find.all=SELECT * FROM category ORDER BY category_name
category.find.by.id=SELECT * FROM category WHERE category_id = ?
category.search.by.name=SELECT * FROM category WHERE category_name LIKE ?
category.find.by.name=SELECT * FROM category WHERE category_name = ?
category.update.name=UPDATE category SET category_name = ? WHERE category_id = ?
category.delete-by.id=DELETE FROM category WHERE category_id = ?