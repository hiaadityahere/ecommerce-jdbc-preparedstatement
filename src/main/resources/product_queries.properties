# ===== PRODUCT TABLE QUERY =====
product.save=INSERT INTO product(product_name, price, category_id, brand_id, stock_quantity) VALUES (?, ?, ?, ?, ?)

product.find.all=SELECT p.* FROM product p ORDER BY p.product_id 
product.find.all.active=SELECT p.* FROM product p WHERE p.is_active = true ORDER BY p.product_name
product.find.by.id=SELECT p.* FROM product p WHERE p.product_id = ?
product.search.by.name=SELECT p.* FROM product p WHERE p.product_name LIKE ? ORDER BY p.product_name
product.find.by.name=SELECT p.* FROM product p WHERE p.product_name = ?
product.find.by.category=SELECT p.* FROM product p JOIN category c ON p.category_id = c.category_id WHERE c.category_name = ? ORDER BY p.product_name
product.find.by.min.price=SELECT * FROM product p WHERE p.price >= ? ORDER BY p.price
product.find.by.price.range=SELECT p.* FROM product p WHERE p.price BETWEEN ? AND ? ORDER BY p.price

product.update.name=UPDATE product SET product_name = ?, updated_at = CURRENT_TIMESTAMP WHERE product_id = ?
product.update.category=UPDATE product SET category_id = ?, updated_at = CURRENT_TIMESTAMP WHERE product_id = ?
product.update.price=UPDATE product SET price = ?, updated_at = CURRENT_TIMESTAMP WHERE product_id = ?
product.delete.by.id=DELETE FROM product WHERE product_id = ?
